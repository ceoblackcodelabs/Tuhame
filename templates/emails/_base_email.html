<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}{{ site_name }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f1ea;font-family:Georgia,'Times New Roman',serif;color:#1a1a1a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ea;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:480px;background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e5decf;">
          <tr>
            <td style="background:#0f0f0f;padding:24px 32px;text-align:center;">
              <span style="color:#d4af37;font-size:22px;font-weight:bold;letter-spacing:0.06em;">{{ site_name }}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {% block body %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background:#faf8f3;border-top:1px solid #e5decf;text-align:center;">
              <span style="font-size:12px;color:#8a8272;">
                {{ site_name }} &middot; <a href="{{ site_url }}" style="color:#8a8272;">{{ site_url }}</a>
              </span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
