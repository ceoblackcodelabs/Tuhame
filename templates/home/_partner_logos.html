{% for partner in partners %}
<div class="partner-logo-card" style="--partner-color:#2563EB;">
  {% if partner.link %}<a href="{{ partner.link }}" target="_blank" rel="noopener noreferrer" class="partner-logo-link" title="Visit {{ partner.name }}">{% endif %}
    {% if partner.logo %}
      <img class="partner-logo-img" src="{{ partner.logo.url }}" alt="{{ partner.name }}" loading="lazy" />
    {% else %}
      <svg class="partner-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V10l6 4v-4l6 4v-4l6 4v7Z"/><path d="M3 21h18"/></svg>
    {% endif %}
    <span class="partner-logo-name">{{ partner.name }}</span>
  {% if partner.link %}</a>{% endif %}
</div>
{% endfor %}
