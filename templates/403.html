<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Access Denied – 2Hame</title>
<style>
  :root{--primary:#2563EB;--green:#16341f;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    color:#1F2937;padding:1.5rem;}
  .card{max-width:460px;width:100%;text-align:center;}
  .brand{display:inline-flex;align-items:center;gap:0.5rem;font-weight:800;font-size:1.1rem;
    color:var(--green);margin-bottom:2rem;text-decoration:none;}
  .code{font-size:5rem;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--primary),#22c55e);
    -webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 0.5rem;}
  h1{font-size:1.3rem;margin:0 0 0.6rem;color:#111827;}
  p{color:#6B7280;line-height:1.6;margin:0 0 2rem;font-size:0.95rem;}
  .actions{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;}
  .btn{display:inline-block;padding:0.75rem 1.5rem;border-radius:10px;font-weight:700;font-size:0.9rem;
    text-decoration:none;transition:opacity .15s;}
  .btn:hover{opacity:0.9;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-ghost{background:#fff;color:#374151;border:1px solid #E5E7EB;}
</style>
</head>
<body>
  <div class="card">
    <a href="/" class="brand">🏡 2Hame</a>
    <div class="code">403</div>
    <h1>You don't have access to this page</h1>
    <p>This area is restricted — for example, the dashboard is only open to verified property owners. If you think this is a mistake, sign in with the right account or request verification from your profile.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Back To Home</a>
      <a href="/users/login/" class="btn btn-ghost">Sign In</a>
    </div>
  </div>
</body>
</html>
