<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/static/assets/images/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/static/assets/images/favicon-32.png" />
<link rel="shortcut icon" type="image/x-icon" href="/static/assets/images/favicon.ico" />
<title>Server Error – 2Hame</title>
<style>
  :root{--primary:#2563EB;--green:#16341f;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    color:#1F2937;padding:1.5rem;}
  .card{max-width:460px;width:100%;text-align:center;}
  .brand{display:inline-flex;align-items:center;gap:0.5rem;font-weight:800;font-size:1.1rem;
    color:var(--green);margin-bottom:2rem;text-decoration:none;}
  .code{font-size:5rem;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--primary),#22c55e);
    -webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 0.5rem;}
  h1{font-size:1.3rem;margin:0 0 0.6rem;color:#111827;}
  p{color:#6B7280;line-height:1.6;margin:0 0 2rem;font-size:0.95rem;}
  .btn{display:inline-block;padding:0.75rem 1.5rem;border-radius:10px;font-weight:700;font-size:0.9rem;
    text-decoration:none;background:var(--primary);color:#fff;}
  .brand img{width:24px;height:24px;border-radius:6px;}
</style>
</head>
<body>
  <div class="card">
    <a href="/" class="brand"><img src="/static/assets/images/favicon.svg" alt="" /> 2Hame</a>
    <div class="code">500</div>
    <h1>Something went wrong on our end</h1>
    <p>This isn't something you did — our team has been notified and is looking into it. Please try again in a moment.</p>
    <a href="/" class="btn">Back To Home</a>
  </div>
</body>
</html>
