<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>{% if status == 429 %}Slow down{% else %}Please try again{% endif %}</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #e6eaf8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 1.5rem; }
    main { max-width: 28rem; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 .6rem; }
    p { color: #b4bedc; line-height: 1.6; margin: 0 0 1.5rem; }
    a { display: inline-block; background: #2563EB; color: #fff; text-decoration: none; font-weight: 700; padding: .75rem 1.6rem; border-radius: 999px; }
  </style>
</head>
<body>
  <main>
    <h1>{% if status == 429 %}Too many attempts{% else %}Please try again{% endif %}</h1>
    <p>{{ message }}</p>
    <a href="javascript:history.back()">Go back</a>
  </main>
</body>
</html>
